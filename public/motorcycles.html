<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>الدراجات | دراجتك عندنا</title>
  <meta name="description" content="تصفّح قائمة الدراجات النارية المتاحة للبيع في حضرموت. ابحث وفلتر حسب الموديل، السعر، والمدينة بكل سهولة.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="الدراجات | دراجتك عندنا">
  <meta property="og:description" content="تصفّح قائمة الدراجات النارية المتاحة للبيع في حضرموت. ابحث وفلتر حسب الموديل، السعر، والمدينة بكل سهولة.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://darajatak-endana.onrender.com/motorcycles.html">
  <meta property="og:image" content="/api/images/logo-1782041024871-73cb3a6f.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/api/images/logo-1782041024871-73cb3a6f.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=7">
</head>
<body data-page="motorcycles">
  <div id="site-header"></div>

  <div class="container-wide page-section">
    <!-- Search & Filter Card (مربع البحث المبرز) -->
    <div class="search-filter-card">
      <div class="search-filter-header">
        <h1 class="search-filter-title">
          <i class="fas fa-sliders"></i> ابحث عن الدراجة المناسبة
        </h1>
      </div>

      <div class="search-inputs-grid">
        <div class="search-input-main">
          <i class="fas fa-search" style="color:var(--text-muted);margin-left:8px;"></i>
          <input id="q-search" type="text" placeholder="البحث عن دراجة..." autocomplete="off">
        </div>
        <input id="q-city" type="text" placeholder="المدينة..." class="search-input-field">
        <select id="q-region" class="search-input-field" style="cursor:pointer;">
          <option value="">المنطقة (الكل)</option>
          <option value="ساحل حضرموت">ساحل حضرموت</option>
          <option value="وادي حضرموت">وادي حضرموت</option>
        </select>
        <input id="q-min-price" type="number" min="0" placeholder="السعر من..." class="search-input-field">
        <input id="q-max-price" type="number" min="0" placeholder="السعر إلى..." class="search-input-field">
        <input id="q-brand" type="text" placeholder="النوع..." class="search-input-field full-mobile">
      </div>
    </div>

    <!-- Listings Result count + Sort bar -->
    <div class="search-results-bar" style="padding-left:4px;padding-right:4px;">
      <span id="result-count" class="text-muted" style="font-size:.88rem;font-weight:700;"></span>
      <select id="sort-select" class="f-select" style="min-width:auto;width:auto;flex:none;height:40px;border:1.5px solid var(--border-light);background:var(--bg-card);border-radius:12px;padding:0 28px 0 12px;font-size:.85rem;color:var(--text-primary);outline:none;cursor:pointer;">
        <option value="newest">الأحدث</option>
        <option value="price_asc">السعر: الأقل أولاً</option>
        <option value="price_desc">السعر: الأعلى أولاً</option>
        <option value="views_desc">الأكثر مشاهدة</option>
      </select>
    </div>

    <div id="listings" class="card-grid card-grid--in-container"></div>
    <div id="pagination"></div>
  </div>

  <div id="site-footer"></div>

  <script src="/js/api.js?v=8"></script>
  <script src="/js/layout.js?v=8"></script>
  <script src="/js/card.js?v=8"></script>
  <script src="/js/motorcycles.js?v=8"></script>
  <script>loadSite();</script>
</body>
</html>
