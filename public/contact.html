<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تواصل معنا | دراجتك عندنا</title>
  <meta name="description" content="تواصل مع فريق دراجتك عندنا عبر واتساب.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="تواصل معنا | دراجتك عندنا">
  <meta property="og:description" content="تواصل مع فريق دراجتك عندنا.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daragatuk.sa/contact.html">
  <link rel="canonical" href="https://daragatuk.sa/contact.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main class="container-wide page-section page-content page-content--narrow">
    <h1>تواصل <span style="color:var(--primary)">معنا</span></h1>
    <p style="color:var(--text-body);margin-bottom:24px;">نحن هنا لمساعدتك. تواصل معنا عبر واتساب أو البريد الإلكتروني.</p>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <a id="contact-wa" href="#" target="_blank" class="btn-whatsapp" style="height:56px;font-size:1rem;text-decoration:none;border-radius:14px;">
        <i class="fab fa-whatsapp"></i> تواصل عبر واتساب
      </a>
      <div style="display:flex;align-items:center;gap:8px;padding:16px;background:var(--bg-card);border-radius:12px;">
        <i class="fas fa-envelope" style="color:var(--primary)"></i>
        <span id="contact-email" style="color:var(--text-muted);font-size:.9rem;">info@daragatuk.sa</span>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
  (async function() {
    await loadSite();
    const wa = document.getElementById('contact-wa');
    const num = (window.SITE && SITE.whatsapp_number) || '967000000000';
    if (wa) wa.href = 'https://wa.me/' + num.replace(/[^0-9]/g,'');
    const email = document.getElementById('contact-email');
    if (email && SITE.email) email.textContent = SITE.email;
  })();
  </script>
</body>
</html>
