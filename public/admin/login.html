<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تسجيل الدخول | لوحة التحكم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page admin-login">
  <button type="button" class="admin-theme-fab" onclick="toggleTheme()" aria-label="تبديل الوضع">
    <i class="fas fa-circle-half-stroke"></i>
  </button>

  <main class="w-full max-w-md">
    <div class="text-center mb-8">
      <div id="logo-container" class="text-5xl mb-3">🏍️</div>
      <h1 class="text-2xl font-black gold-text-gradient">لوحة التحكم</h1>
      <p class="text-gray-400 text-sm mt-1">دخول المدراء</p>
    </div>

    <form id="login-form" class="admin-login-card rounded-2xl p-8 space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">البريد الإلكتروني</label>
        <input id="email" type="email" required value="admin@daragatuk.sa" class="admin-login-input">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">كلمة المرور</label>
        <input id="password" type="password" required placeholder="••••••••" class="admin-login-input">
      </div>
      <p id="error-msg" class="text-red-400 text-sm hidden"></p>
      <button type="submit" id="submit-btn"
              class="w-full gold-gradient font-extrabold py-3 rounded-xl hover:scale-[1.02] transition">
        <i class="fas fa-right-to-bracket ml-1"></i> دخول
      </button>
      <a href="/" class="block text-center text-gray-500 text-sm hover:text-gold mt-2">العودة للموقع</a>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/admin/js/admin.js"></script>
  <script>
    // تحميل الشعار من الإعدادات
    API.settings().then(res => {
      const url = (res.data || {}).logo_url;
      if (url) document.getElementById('logo-container').innerHTML = '<img src="' + url + '" alt="" style="height:60px;max-width:240px;object-fit:contain;margin:0 auto">';
    }).catch(() => {});

    const form = document.getElementById('login-form');
    const err = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    // إذا كان مسجّلاً بالفعل، انتقل للوحة
    API.get('/auth/me').then(() => location.href = '/admin/').catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.add('hidden');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
      try {
        await API.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        location.href = '/admin/';
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove('hidden');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-right-to-bracket ml-1"></i> دخول';
      }
    });
  </script>
</body>
</html>
